<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中2理科：原子と化学式マスター</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React DOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for inline JSX execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const IconAtom = () => (
      <svg className="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="3" />
        <ellipse cx="12" cy="12" rx="9" ry="3" transform="rotate(30 12 12)" />
        <ellipse cx="12" cy="12" rx="9" ry="3" transform="rotate(90 12 12)" />
        <ellipse cx="12" cy="12" rx="9" ry="3" transform="rotate(150 12 12)" />
      </svg>
    );

    const IconFlask = () => (
      <svg className="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9 3h6M10 3v5l-4.5 8.5A2 2 0 0 0 7.2 19.5h9.6a2 2 0 0 0 1.7-3L14 8V3" />
        <path d="M8.5 13h7" />
      </svg>
    );

    const IconBook = () => (
      <svg className="w-6 h-6 stroke-current" viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
      </svg>
    );

    const IconCheck = () => (
      <svg className="w-5 h-5 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    );

    const IconX = () => (
      <svg className="w-5 h-5 text-rose-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    );

    const IconRefresh = () => (
      <svg className="w-5 h-5 stroke-current" viewBox="0 0 24 24" fill="none" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6" />
        <path d="M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
      </svg>
    );

    const IconTrophy = () => (
      <svg className="w-8 h-8 text-amber-400 fill-amber-100 stroke-current" viewBox="0 0 24 24" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
        <path d="M4 22h16" />
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2z" />
      </svg>
    );

    const ELEMENTS = [
      { symbol: 'H', name: '水素', category: '非金属', color: 'bg-sky-100 text-sky-800 border-sky-300', atomColor: '#38bdf8', tip: '宇宙で一番多い気体。燃えると水になる。' },
      { symbol: 'He', name: 'ヘリウム', category: '非金属', color: 'bg-purple-100 text-purple-800 border-purple-300', atomColor: '#c084fc', tip: '風船に入れられる軽い気体。' },
      { symbol: 'C', name: '炭素', category: '非金属', color: 'bg-slate-200 text-slate-800 border-slate-400', atomColor: '#475569', tip: '木炭やダイヤモンドの成分。' },
      { symbol: 'N', name: '窒素', category: '非金属', color: 'bg-indigo-100 text-indigo-800 border-indigo-300', atomColor: '#818cf8', tip: '空気の約80%を占める気体。' },
      { symbol: 'O', name: '酸素', category: '非金属', color: 'bg-rose-100 text-rose-800 border-rose-300', atomColor: '#fb7185', tip: '息を吸うときに必要。物を燃やす働きがある。' },
      { symbol: 'Na', name: 'ナトリウム', category: '金属', color: 'bg-amber-100 text-amber-800 border-amber-300', atomColor: '#fbbf24', tip: '食塩（塩化ナトリウム）の構成元素。' },
      { symbol: 'Mg', name: 'マグネシウム', category: '金属', color: 'bg-emerald-100 text-emerald-800 border-emerald-300', atomColor: '#34d399', tip: '激しく光を出して燃える軽い金属。' },
      { symbol: 'Al', name: 'アルミニウム', category: '金属', color: 'bg-teal-100 text-teal-800 border-teal-300', atomColor: '#2dd4bf', tip: 'アルミ缶や一円玉の材料。' },
      { symbol: 'S', name: '硫黄', category: '非金属', color: 'bg-yellow-100 text-yellow-800 border-yellow-300', atomColor: '#facc15', tip: '黄色い固体。温泉の匂いの元。' },
      { symbol: 'Cl', name: '塩素', category: '非金属', color: 'bg-lime-100 text-lime-800 border-lime-300', atomColor: '#a3e635', tip: 'プールなどの消毒に使われる刺激臭のある気体。' },
      { symbol: 'K', name: 'カリウム', category: '金属', color: 'bg-orange-100 text-orange-800 border-orange-300', atomColor: '#fb923c', tip: '植物の成長に欠かせない肥料の成分。' },
      { symbol: 'Ca', name: 'カルシウム', category: '金属', color: 'bg-stone-200 text-stone-800 border-stone-400', atomColor: '#a8a29e', tip: '骨や歯を作る大事な金属元素。' },
      { symbol: 'Fe', name: '鉄', category: '金属', color: 'bg-cyan-100 text-cyan-800 border-cyan-300', atomColor: '#22d3ee', tip: '磁石につく。身近な金属。' },
      { symbol: 'Cu', name: '銅', category: '金属', color: 'bg-amber-200 text-amber-900 border-amber-400', atomColor: '#f59e0b', tip: '赤褐色で電気をよく通す。10円玉。' },
      { symbol: 'Zn', name: '亜鉛', category: '金属', color: 'bg-blue-100 text-blue-800 border-blue-300', atomColor: '#60a5fa', tip: 'トタン板のめっきなどに使われる。' },
      { symbol: 'Ag', name: '銀', category: '金属', color: 'bg-slate-300 text-slate-900 border-slate-400', atomColor: '#cbd5e1', tip: '美しい輝きを持つ金属。熱や電気を一番良く通す。' },
      { symbol: 'Au', name: '金', category: '金属', color: 'bg-yellow-200 text-yellow-900 border-yellow-400', atomColor: '#eab308', tip: '変色しにくく非常に貴重な金属。' },
      { symbol: 'Ba', name: 'バリウム', category: '金属', color: 'bg-green-100 text-green-800 border-green-300', atomColor: '#4ade80', tip: '胃のX線検査（レントゲン）の造影剤に用いられる。' },
      { symbol: 'CO', name: '※化合物注意', category: '発展', color: 'bg-gray-100 text-gray-500 border-gray-300', atomColor: '#94a3b8', tip: '※Co(コバルト)とCO(一酸化炭素)の大小文字の違いに注意！' }
    ];

    const FORMULAS_DATA = [
      { name: '水', formula: 'H2O', tip: '水素原子2個と酸素原子1個が結合した分子。' },
      { name: '二酸化炭素', formula: 'CO2', tip: '炭素原子1個と酸素原子2個からなる分子。' },
      { name: '酸素', formula: 'O2', tip: '酸素原子2個が結びついた気体の単体。' },
      { name: '水素', formula: 'H2', tip: '最も軽い気体。水素原子2個が結びついた単体。' },
      { name: '窒素', formula: 'N2', tip: '空気の約8割を占める気体。窒素原子2個の単体。' },
      { name: '塩素', formula: 'Cl2', tip: '黄緑色で刺激臭のある気体。塩素原子2個の単体。' },
      { name: '塩化水素', formula: 'HCl', tip: '水に溶かすと塩酸になる気体分子。' },
      { name: 'アンモニア', formula: 'NH3', tip: '窒素1個と水素3個からなる刺激臭の気体分子。' },
      { name: '酸化銅', formula: 'CuO', tip: '銅を加熱するとできる黒色の化合物。' },
      { name: '硫化鉄', formula: 'FeS', tip: '鉄と硫黄を加熱して反応させた黒色の化合物。' },
      { name: '塩化ナトリウム', formula: 'NaCl', tip: '食塩の主成分。ナトリウムと塩素の化合物。' },
      { name: '炭酸水素ナトリウム', formula: 'NaHCO3', tip: '重曹のこと。加熱分解で二酸化炭素が発生。' },
      { name: '炭酸ナトリウム', formula: 'Na2CO3', tip: '炭酸水素ナトリウムを加熱分解した後に残る白いアルカリ性の物質。' },
      { name: '酸化銀', formula: 'Ag2O', tip: '黒色の固体。加熱分解で銀と酸素に分かれる。' },
      { name: '硫化銅', formula: 'CuS', tip: '銅と硫黄が結びついてできる黒色の化合物。' },
      { name: '酸化マグネシウム', formula: 'MgO', tip: 'マグネシウムが光を出して燃焼した後にできる白色粉末。' },
      { name: 'メタン', formula: 'CH4', tip: '天然ガスの主成分。炭素1個と水素4個の分子。' }
    ];

    const formatFormulaText = (str) => {
      const subMap = { '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄', '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉' };
      return str.replace(/[0-9]/g, match => subMap[match] || match);
    };

    const BUILDER_COMPOUNDS = [
      { name: '水', formula: 'H2O', formatted: <span>H<sub>2</sub>O</span>, parts: { H: 2, O: 1 }, type: '化合物（分子をつくる）', desc: '水素原子2個と酸素原子1個が結びついた物質。' },
      { name: '二酸化炭素', formula: 'CO2', formatted: <span>CO<sub>2</sub></span>, parts: { C: 1, O: 2 }, type: '化合物（分子をつくる）', desc: '炭素原子1個と酸素原子2個が結びついた物質。' },
      { name: '酸素', formula: 'O2', formatted: <span>O<sub>2</sub></span>, parts: { O: 2 }, type: '単体（分子をつくる）', desc: '酸素原子2個が結びついた気体。' },
      { name: '水素', formula: 'H2', formatted: <span>H<sub>2</sub></span>, parts: { H: 2 }, type: '単体（分子をつくる）', desc: '最も軽い気体。水素原子2個で1つの分子。' },
      { name: '塩化水素', formula: 'HCl', formatted: <span>HCl</span>, parts: { H: 1, Cl: 1 }, type: '化合物（分子をつくる）', desc: '水に溶かすと塩酸になる気体。' },
      { name: 'アンモニア', formula: 'NH3', formatted: <span>NH<sub>3</sub></span>, parts: { N: 1, H: 3 }, type: '化合物（分子をつくる）', desc: '窒素原子1個に水素原子3個が結びついた刺激臭のある気体。' },
      { name: '酸化銅', formula: 'CuO', formatted: <span>CuO</span>, parts: { Cu: 1, O: 1 }, type: '化合物（分子をつくらない）', desc: '銅を加熱して酸素と結合させた黒色の物質。' },
      { name: '硫化鉄', formula: 'FeS', formatted: <span>FeS</span>, parts: { Fe: 1, S: 1 }, type: '化合物（分子をつくらない）', desc: '鉄と硫黄を結びつけた黒色の物質。' },
      { name: '塩化ナトリウム', formula: 'NaCl', formatted: <span>NaCl</span>, parts: { Na: 1, Cl: 1 }, type: '化合物（分子をつくらない）', desc: '食塩の主成分。ナトリウムと塩素が交互に並ぶ。' },
      { name: '窒素', formula: 'N2', formatted: <span>N<sub>2</sub></span>, parts: { N: 2 }, type: '単体（分子をつくる）', desc: '空気の約8割を占める気体。窒素原子2個の分子。' },
      { name: '塩素', formula: 'Cl2', formatted: <span>Cl<sub>2</sub></span>, parts: { Cl: 2 }, type: '単体（分子をつくる）', desc: '黄緑色で刺激臭のある気体。塩素原子2個の分子。' },
      { name: 'メタン', formula: 'CH4', formatted: <span>CH<sub>4</sub></span>, parts: { C: 1, H: 4 }, type: '化合物（分子をつくる）', desc: '天然ガスの主成分。炭素原子1個に水素原子4個が結合。' },
      { name: '硫化銅', formula: 'CuS', formatted: <span>CuS</span>, parts: { Cu: 1, S: 1 }, type: '化合物（分子をつくらない）', desc: '銅と硫黄が反応してできる黒色の物質。' },
      { name: '一酸化炭素', formula: 'CO', formatted: <span>CO</span>, parts: { C: 1, O: 1 }, type: '化合物（分子をつくる）', desc: '炭素が不完全燃焼すると発生する毒性のある気体。' },
      { name: '酸化銀', formula: 'Ag2O', formatted: <span>Ag<sub>2</sub>O</span>, parts: { Ag: 2, O: 1 }, type: '化合物（分子をつくらない）', desc: '黒色の粉末。加熱すると銀と酸素に分解する。' },
      { name: '酸化マグネシウム', formula: 'MgO', formatted: <span>MgO</span>, parts: { Mg: 1, O: 1 }, type: '化合物（分子をつくらない）', desc: 'マグネシウムが激しく燃焼したあとにできる白色の物質。' },
      { name: '塩化銅', formula: 'CuCl2', formatted: <span>CuCl<sub>2</sub></span>, parts: { Cu: 1, Cl: 2 }, type: '化合物（分子をつくらない）', desc: '銅と塩素の化合物。水溶液は青色になる。' },
      { name: '硫化水素', formula: 'H2S', formatted: <span>H<sub>2</sub>S</span>, parts: { H: 2, S: 1 }, type: '化合物（分子をつくる）', desc: '火山ガスなどに含まれる、腐った卵のような臭いがする気体。' },
      { name: '二酸化硫黄', formula: 'SO2', formatted: <span>SO<sub>2</sub></span>, parts: { S: 1, O: 2 }, type: '化合物（分子をつくる）', desc: '硫黄が燃えると発生する刺激臭のある気体。' },
      { name: '過酸化水素', formula: 'H2O2', formatted: <span>H<sub>2</sub>O<sub>2</sub></span>, parts: { H: 2, O: 2 }, type: '化合物（分子をつくる）', desc: 'オキシドールの成分。分解すると酸素を発生する。' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('quiz');

      // クイズ用状態
      const [quizIndex, setQuizIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [quizFinished, setQuizFinished] = useState(false);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isAnswered, setIsAnswered] = useState(false);
      const [quizQuestions, setQuizQuestions] = useState([]);
      const [quizLevel, setQuizLevel] = useState(1);
      const [quizLevelNotice, setQuizLevelNotice] = useState(null);

      // 30問クイズ生成機能
      const generateQuiz = () => {
        const validElements = ELEMENTS.filter(e => e.category !== '発展');
        const questions = [];

        const shuffledElements = [...validElements].sort(() => Math.random() - 0.5);
        const shuffledFormulas = [...FORMULAS_DATA].sort(() => Math.random() - 0.5);

        // 元素記号問題 (15問)
        shuffledElements.slice(0, 15).forEach((item, index) => {
          const type = index % 2 === 0 ? 'elemSymbolToName' : 'elemNameToSymbol';
          if (type === 'elemSymbolToName') {
            const wrongOptions = validElements
              .filter(e => e.symbol !== item.symbol)
              .sort(() => Math.random() - 0.5)
              .slice(0, 3)
              .map(e => e.name);
            const options = [...wrongOptions, item.name].sort(() => Math.random() - 0.5);
            questions.push({
              categoryTitle: '元素記号クイズ',
              type,
              promptText: 'この元素記号の名称（名前）は？',
              displayValue: item.symbol,
              correctAnswer: item.name,
              options,
              tip: item.tip,
              isMonoFont: false
            });
          } else {
            const wrongOptions = validElements
              .filter(e => e.symbol !== item.symbol)
              .sort(() => Math.random() - 0.5)
              .slice(0, 3)
              .map(e => e.symbol);
            const options = [...wrongOptions, item.symbol].sort(() => Math.random() - 0.5);
            questions.push({
              categoryTitle: '元素記号クイズ',
              type,
              promptText: `「${item.name}」の元素記号は？`,
              displayValue: item.name,
              correctAnswer: item.symbol,
              options,
              tip: item.tip,
              isMonoFont: true
            });
          }
        });

        // 化学式問題 (15問)
        shuffledFormulas.slice(0, 15).forEach((item, index) => {
          const type = index % 2 === 0 ? 'formulaToName' : 'nameToFormula';
          const formattedFormula = formatFormulaText(item.formula);

          if (type === 'formulaToName') {
            const wrongOptions = FORMULAS_DATA
              .filter(f => f.formula !== item.formula)
              .sort(() => Math.random() - 0.5)
              .slice(0, 3)
              .map(f => f.name);
            const options = [...wrongOptions, item.name].sort(() => Math.random() - 0.5);
            questions.push({
              categoryTitle: '化学式マスタークイズ',
              type,
              promptText: 'この化学式が表す物質の名称は？',
              displayValue: formattedFormula,
              correctAnswer: item.name,
              options,
              tip: item.tip,
              isMonoFont: false
            });
          } else {
            const wrongOptions = FORMULAS_DATA
              .filter(f => f.formula !== item.formula)
              .sort(() => Math.random() - 0.5)
              .slice(0, 3)
              .map(f => formatFormulaText(f.formula));
            const options = [...wrongOptions, formattedFormula].sort(() => Math.random() - 0.5);
            questions.push({
              categoryTitle: '化学式マスタークイズ',
              type,
              promptText: `「${item.name}」の化学式は？`,
              displayValue: item.name,
              correctAnswer: formattedFormula,
              options,
              tip: item.tip,
              isMonoFont: true
            });
          }
        });

        setQuizQuestions(questions.sort(() => Math.random() - 0.5));
        setQuizIndex(0);
        setScore(0);
        setQuizLevel(1);
        setQuizLevelNotice(null);
        setQuizFinished(false);
        setSelectedOption(null);
        setIsAnswered(false);
      };

      useEffect(() => {
        generateQuiz();
        initBuilderGame();
      }, []);

      const handleOptionSelect = (opt) => {
        if (isAnswered) return;
        setSelectedOption(opt);
        setIsAnswered(true);

        const currentCorrect = quizQuestions[quizIndex].correctAnswer;
        if (opt === currentCorrect) {
          setScore(prev => prev + 1);
          setQuizLevel(prev => prev + 2);
          setQuizLevelNotice('+2');
        } else {
          setQuizLevel(prev => Math.max(1, prev - 1));
          setQuizLevelNotice('-1');
        }
      };

      const handleNextQuiz = () => {
        if (quizIndex + 1 < quizQuestions.length) {
          setQuizIndex(prev => prev + 1);
          setSelectedOption(null);
          setIsAnswered(false);
          setQuizLevelNotice(null);
        } else {
          setQuizFinished(true);
        }
      };

      const [builderQuestions, setBuilderQuestions] = useState([]);
      const [builderIndex, setBuilderIndex] = useState(0);
      const [builderScore, setBuilderScore] = useState(0);
      const [builderFinished, setBuilderFinished] = useState(false);
      const [userAtoms, setUserAtoms] = useState([]);
      const [builderIsAnswered, setBuilderIsAnswered] = useState(false);
      const [builderIsCorrect, setBuilderIsCorrect] = useState(false);
      const [showHint, setShowHint] = useState(false);
      const [hasScoredCurrent, setHasScoredCurrent] = useState(false);
      const [playerLevel, setPlayerLevel] = useState(1);
      const [hasPenalizedCurrent, setHasPenalizedCurrent] = useState(false);
      const [levelNotice, setLevelNotice] = useState(null);

      const initBuilderGame = () => {
        const shuffled = [...BUILDER_COMPOUNDS].sort(() => Math.random() - 0.5).slice(0, 20);
        setBuilderQuestions(shuffled);
        setBuilderIndex(0);
        setBuilderScore(0);
        setPlayerLevel(1);
        setBuilderFinished(false);
        setUserAtoms([]);
        setBuilderIsAnswered(false);
        setBuilderIsCorrect(false);
        setShowHint(false);
        setHasScoredCurrent(false);
        setHasPenalizedCurrent(false);
        setLevelNotice(null);
      };

      const currentBuilderTarget = builderQuestions[builderIndex] || BUILDER_COMPOUNDS[0];

      const handleAddAtomByModel = (symbol) => {
        if (builderIsAnswered) return;
        setUserAtoms(prev => [...prev, symbol]);
      };

      const handleRemoveAtomAtIndex = (indexToRemove) => {
        if (builderIsAnswered) return;
        setUserAtoms(prev => prev.filter((_, idx) => idx !== indexToRemove));
      };

      const handleResetBuilderAtoms = () => {
        if (builderIsAnswered) return;
        setUserAtoms([]);
      };

      const checkBuilderAnswer = () => {
        if (builderIsAnswered) return;
        const required = currentBuilderTarget.parts;

        const counts = userAtoms.reduce((acc, sym) => {
          acc[sym] = (acc[sym] || 0) + 1;
          return acc;
        }, {});

        let correct = true;

        Object.keys(required).forEach(sym => {
          if ((counts[sym] || 0) !== required[sym]) {

                                  `解説: ${currentBuilderTarget.name}（${currentBuilderTarget.formula}）は${currentBuilderTarget.desc}`
                                ) : (
                                  `💡 ヒントが開きました！化学式「${currentBuilderTarget.formula}」を参考に原子を並べ直して再挑戦しよう！`
                                )}
                              </p>
                            </div>
                          </div>

                          {builderIsCorrect ? (
                            <button
                              onClick={handleNextBuilderQuestion}
                              className="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition flex items-center justify-center gap-2"
                            >
                              次のミッションへ進む
                            </button>
                          ) : (
                            <button
                              onClick={handleRetryBuilder}
                              className="w-full py-3.5 bg-amber-500 text-white font-bold rounded-xl shadow-md hover:bg-amber-600 transition flex items-center justify-center gap-2 text-base active:scale-98"
                            >
                              <IconRefresh /> もう一度組み立て直す（正解するまで進めません）
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="text-center py-8 space-y-4">
                      <div className="inline-block p-4 bg-amber-50 rounded-full border border-amber-200">
                        <IconTrophy />
                      </div>
                      <h3 className="text-2xl font-black text-slate-800">全{builderQuestions.length}クエスト 完了！</h3>
                      <div className="p-4 bg-indigo-50 rounded-2xl border border-indigo-100 max-w-sm mx-auto">
                        <p className="text-sm text-indigo-700 font-bold">最終結果</p>
                        <p className="text-4xl font-black text-amber-500 my-1">Lv. {playerLevel}</p>
                        <p className="text-xs text-indigo-950">
                          正解数: <strong className="text-indigo-600 font-bold">{builderScore}</strong> / {builderQuestions.length} 問
                        </p>
                      </div>
                      <button
                        onClick={initBuilderGame}
                        className="mt-4 px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition inline-flex items-center gap-2"
                      >
                        <IconRefresh /> もう一度クエストに挑戦する
                      </button>
                    </div>
                  )}
                </div>
              </section>
            )}

            {}
            {activeTab === 'handbook' && (
              <section className="space-y-6">
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                  <h2 className="text-xl font-bold text-slate-800 mb-2 flex items-center gap-2">
                    <span className="p-2 bg-amber-100 text-amber-600 rounded-lg">📖</span>
                    中2化学：テストに出る重要ポイントまとめノート
                  </h2>
                  <p className="text-slate-600 text-sm">
                    原子・分子の性質や、化学式の表し方のルールをまとめて確認できます。
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                    <h3 className="text-lg font-bold text-blue-700 border-b pb-2">1. 原子（ドルトンが提唱）の3ルール</h3>
                    <ul className="space-y-2 text-sm text-slate-700 list-disc list-inside">
                      <li>それ以上<strong>分けることができない</strong>。</li>
                      <li>化学変化によって<strong>なくなったり、新しくできたり、他の原子に変わったりしない</strong>。</li>
                      <li>種類によって<strong>質量や大きさが決まっている</strong>。</li>
                    </ul>
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                    <h3 className="text-lg font-bold text-indigo-700 border-b pb-2">2. 単体と化合物・分子をつくる物質</h3>
                    <div className="space-y-2 text-sm text-slate-700">
                      <p><strong>・単体：</strong>1種類の元素だけでできている物質（例: H₂, O₂, Cu, Fe）</p>
                      <p><strong>・化合物：</strong>2種類以上の元素からできている物質（例: H₂O, CO₂, NaCl）</p>
                      <p className="p-2 bg-amber-50 rounded-lg text-xs text-amber-900 border border-amber-200">
                        💡 <strong>重要！</strong> 金属（Cu, Feなど）や食塩（NaCl）は分子をつくりません（原子が規則正しく無数に並んでいるため）。
                      </p>
                    </div>
                  </div>

                  <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3 md:col-span-2">
                    <h3 className="text-lg font-bold text-emerald-700 border-b pb-2">3. 化学式の数字の意味</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm text-slate-700">
                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <p className="font-bold text-base font-mono text-emerald-600 mb-1">H<sub>2</sub>O の「2」</p>
                        <p className="text-xs leading-relaxed">
                          右下の小さな数字は、<strong>1つの分子をつくっている原子の個数</strong>を表します。（「1」の場合は省略）
                        </p>
                      </div>
                      <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                        <p className="font-bold text-base font-mono text-emerald-600 mb-1">2H<sub>2</sub>O の「2」</p>
                        <p className="text-xs leading-relaxed">
                          化学式の前の大きな数字（係数）は、<strong>その分子全体の個数</strong>を表します。（水分子が2個あるという意味）
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              </section>
            )}

          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
